# Trivy — image scanning
#
# Profile category: image_scanning
# Marketplace: https://github.com/marketplace/actions/aqua-security-trivy
#
# Aqua Security publishes the canonical Trivy GitHub Action. The action
# scans either built images, filesystems, or git repos depending on
# the `scan-type` input. Default below is `image` since that's what the
# DevOps Engineer typically emits in CI workflows for container-shipping
# services.

tool_name: trivy
display_name: Trivy (aquasecurity/trivy-action)
profile_categories:
  - image_scanning
action: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
action_version_label: 0.36.0
inputs:
  scan-type: image
  format: sarif
  output: trivy-results.sarif
  exit-code: "1"
  severity: HIGH,CRITICAL
  ignore-unfixed: "true"
  # The action builds its SARIF in a second scan that ignores `severity`
  # unless told otherwise; without this, LOW and MEDIUM findings would reach
  # code scanning (and Signals) outside the pack's HIGH,CRITICAL scope.
  limit-severities-for-sarif: "true"
sarif_output: trivy-results.sarif
notes: |
  Runs after the docker build step (the image must exist locally for
  scanning). `exit-code: 1` fails the workflow on any HIGH/CRITICAL
  finding by default; soften to `exit-code: 0` if the customer's
  Profile declares a non-blocking posture in `change_management`.
  SARIF output uploads cleanly to GitHub's code-scanning view via a
  follow-on `github/codeql-action/upload-sarif` step.
last_verified: "2026-10-20"

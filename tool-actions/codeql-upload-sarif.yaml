# GitHub code scanning — SARIF upload
#
# Not a Profile tool. It rides along with any scanner pack that sets
# `sarif_output` (trivy, semgrep): the DevOps Engineer emits this step right
# after the scan so the results land in GitHub code scanning, where the
# customer's read-only GitHub Signals source reads them (ADR-0066 decision 9).
# Without it a scanner writes SARIF that nothing ever reads.
#
# Marketplace: https://github.com/github/codeql-action (upload-sarif/)
# Verified 2026-10-20: tag v4.39.0 -> commit 6f2ac81f… (annotated tag
# dereferenced), and upload-sarif/action.yml exists at that commit.

tool_name: codeql-upload-sarif
display_name: GitHub code scanning SARIF upload (github/codeql-action/upload-sarif)
profile_categories: []
action: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
action_version_label: v4.39.0
inputs: {}
# docs.github.com, "Uploading a SARIF file to GitHub": `security-events: write`
# is required for all workflows and `actions: read` for workflows in private
# repositories; the example grants `contents: read` alongside.
permissions:
  actions: read
  contents: read
  security-events: write
notes: |
  Emit immediately after the scan step, with `if: always()` so a scan that
  fails the job on findings still uploads them, `continue-on-error: true`,
  and `with: { sarif_file: <the scanner's sarif_output>, category: <tool_name> }`.
  The job needs `permissions: { actions: read, contents: read,
  security-events: write }`.
  Code scanning shows results only on public repos, or on private and
  internal repos with GitHub Advanced Security (GitHub Code Security)
  enabled. Anywhere else this upload always fails, which is why it is
  non-fatal: it must never fail the customer's build. The SARIF is also kept
  as a workflow artifact (the `upload-artifact` pack), so the results are
  never lost either way.
last_verified: "2026-11-06"

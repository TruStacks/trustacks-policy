# Gitleaks — secret scanning
#
# Profile category: secret_scanning
# Marketplace: https://github.com/marketplace/actions/gitleaks
# Verified 2026-11-02: tag v3.0.0 -> commit e0c47f4f… (runs on node24; v2 is
# node20, which GitHub removed from hosted runners on 2026-09-23).
#
# The Gitleaks org publishes its own GitHub Action. Scans the
# repository's git history for committed secrets. Runs on push/PR
# events; the default config catches the most common credential
# leak patterns out of the box.

tool_name: gitleaks
display_name: Gitleaks (gitleaks/gitleaks-action)
profile_categories:
  - secret_scanning
action: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
action_version_label: v3.0.0
inputs: {}
# Verified 2026-11-06 against src/gitleaks.js at the pinned commit: on a
# pull_request event the action calls GET /repos/{o}/{r}/pulls/{n}/commits
# outside any try, so a job whose token can't read pull requests fails with
# "Resource not accessible by integration" (403, x-accepted-github-permissions:
# pull_requests=read). Seen on the dogfood service repo, 2026-11-06.
permissions:
  contents: read
  pull-requests: read
notes: |
  Pass `env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }` (the token GitHub
  Actions provides; no customer secret). The step needs
  `contents: read, pull-requests: read`: on a pull request the action lists
  the PR's commits, and without `pull-requests: read` it fails with a 403. If
  the job has a `permissions:` block, add them to it; if it has none, leave
  it without one (it inherits the calling job's grant, and a block would drop
  the rest of it), and the calling job must grant them. It also tries to leave review comments on leaked lines; that
  needs `pull-requests: write`, and without it the action logs a warning and
  carries on (the findings still reach the job summary and artifact). Grant
  write only if the customer wants the inline comments.
  A repo owned by a GitHub organization also needs a Gitleaks license (free
  from gitleaks.io), stored as a repo or org secret and passed as
  `GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}` in the same `env:`,
  the name the action's README gives. Without it the action exits with
  "missing gitleaks license". A repo owned by a personal account needs none.
  Reference the secret only when the customer has it; never invent one.
  In a reusable (called) workflow, storing the secret is not enough: a called
  workflow sees only the secrets its caller passes. Either the calling job
  sets `secrets: inherit` (callers in the same organization or enterprise;
  the called workflow may then reference it undeclared), or it passes
  `secrets: { GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} }` and the
  called workflow declares `GITLEAKS_LICENSE` under
  `on.workflow_call.secrets`. Say which in the PR body's caller snippet.
last_verified: "2026-11-06"

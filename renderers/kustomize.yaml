# Kustomize renderer pack (ADR-0052 decisions 2 and 5).
#
# Shaped against a real customer's platform repo rather than an invented one:
# services under a shared root, each with a `base/` and one overlay per
# environment, and the ArgoCD Application pointing at the overlay.
#
# The nesting is the inverse of Helm's on purpose. Our Helm layout puts the
# cluster ABOVE the service, so every cluster gets a complete independent copy —
# correct for a chart plus per-cluster values, and for Kustomize it would
# produce N duplicated bases, which is exactly what base-plus-overlays exists to
# abolish.
renderer: kustomize
display_name: Kustomize

# No `{cluster}`: the cluster is an overlay BELOW the service root. A
# per-cluster root would duplicate the base it exists to share, and the
# Application-level validator rejects one.
default_root_template: gitops/{application}/{service}

# Paths are relative to the resolved service root. `{cluster}` in a path is
# substituted per target cluster, so an Application with three clusters emits
# one base and three overlays rather than three of everything.
files:
  - path: base/kustomization.yaml
    purpose: lists the base resources — no namespace, no image tag
  - path: base/deployment.yaml
    purpose: >-
      the Deployment, with the image left for the overlay to set, and the
      restricted baseline (ADR-0070): pod `securityContext` with
      `runAsNonRoot: true` and `seccompProfile: {type: RuntimeDefault}`; each
      container `securityContext` with `allowPrivilegeEscalation: false` and
      `capabilities: {drop: ["ALL"]}`; `resources.requests` and
      `resources.limits` (cpu and memory) on every container; a containerPort
      above 1024. Never `runAsUser`, `runAsGroup` or `fsGroup`.
  - path: base/service.yaml
    purpose: the ClusterIP Service
  - path: overlays/{cluster}/kustomization.yaml
    purpose: >-
      references ../../base, sets namespace, and pins the image tag via
      `images:` — the per-environment difference, and the only place a tag
      appears
  # Exposure, opt-in (ADR-0070 §3). Kustomize has no `if`, so "off by
  # default" is a component no overlay references: nothing in it deploys until
  # the customer adds it to an overlay and sets their host. The placeholder host
  # can't resolve, so an overlay that enables it without setting one never
  # serves a guessed or wildcard host — and pre-emit validation refuses it.
  - path: components/ingress/kustomization.yaml
    purpose: >-
      `apiVersion: kustomize.config.k8s.io/v1alpha1`, `kind: Component`,
      `resources: [ingress.yaml]`. Referenced by NO overlay you emit; the PR body
      shows the customer how to enable it per overlay
  - path: components/ingress/ingress.yaml
    purpose: >-
      a networking.k8s.io/v1 Ingress routing `/` (Prefix) to the Service, with
      `host: change-me.invalid` (never a guessed host) and no ingressClassName.
      On OpenShift, the annotation `route.openshift.io/termination: edge`: the
      router turns it into a Route that terminates TLS and redirects HTTP to
      HTTPS. `nginx.ingress.kubernetes.io/*` annotations do nothing there

# What the ArgoCD Application points at.
argocd:
  # ArgoCD syncs the OVERLAY, not the service root: the base alone has no
  # namespace and no image tag, so syncing it would deploy something nobody
  # asked for.
  source_path: overlays/{cluster}
  # No release name, and no `helm:` block at all — which removes the field that
  # broke the java-dogfood run (#542).
  release_name: false

# The pre-emit counterpart of `helm template` (ADR-0038 / ADR-0052 decision 7).
# Run against the overlay for the same reason ArgoCD points there: building the
# base proves less than building what actually gets applied.
validation:
  command: kustomize
  args: [build]
